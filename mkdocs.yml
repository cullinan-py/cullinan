site_name: Cullinan Documentation
site_description: "Documentation for the Cullinan engine-neutral Python web framework with built-in IoC/DI, type-safe parameters, pluggable model handlers, and Pydantic integration"
site_author: plumeink
site_url: !ENV [DOCS_SITE_URL, "https://cullinan-py.github.io/cullinan/"]

use_directory_urls: true

nav:
  - Home: README.md
  - Getting Started:
    - Overview: start/index.md
    - Quick Start: getting_started.md
    - Examples: examples.md
    - Build & Run: build_run.md
  - Core Concepts:
    - Overview: concepts/index.md
    - Framework Semantics: framework_semantics.md
    - Architecture: architecture.md
  - Guides:
    - Overview: how-to/index.md
    - Dependency Injection: dependency_injection_guide.md
    - Web Runtime: web_runtime_guide.md
    - Static Files & SPA: static_files_guide.md
    - Parameter System: parameter_system_guide.md
    - DI Quick Reference: quick_reference_di.md
    - Packaging: packaging.md
    - Testing: testing.md
    - Contributing: contributing.md
    - Extension Development: extension_development_guide.md
    - Quick Start Extensions: quick_start_extensions.md
  - API Reference:
    - Overview: reference/index.md
    - API Reference Overview: api_reference.md
    - Module Reference:
      - application: modules/application.md
      - core: modules/core.md
      - controller: modules/controller.md
      - service: modules/service.md
  - Internals:
    - Overview: internals/index.md
    - Application Runtime: wiki/application_runtime.md
    - Components: wiki/components.md
    - Decorators: wiki/decorators.md
    - Injection: wiki/injection.md
    - Lifecycle: wiki/lifecycle.md
    - Middleware: wiki/middleware.md
    - Extensions: wiki/extensions.md
    - RESTful API: wiki/restful_api.md
  - Migration:
    - Overview: migration/index.md
    - Import Migration (0.83 → 0.90): import_migration_090.md
    - Migration Guide v2 (v0.9x → v0.93): migration_guide_v2.md
    - Migration Guide (0.90/0.93 → 0.95): migration_guide.md
    - Final Structure Migration (0.93a6 and earlier → final layout): migration_to_final_semantic_layout.md

# Exclude internal documentation files from nav warnings
not_in_nav: |
  /REFACTORING_VERIFICATION_REPORT.md
  /bugfix_controller_di.md
  /template/**
  /templates/**
  /work/**
  /superpowers/**
  /examples/*.py
  /zh/bugfix_controller_di.md
  /zh/templates/**
  /zh/work/**
  /zh/superpowers/**

# Exclude work directories from being processed entirely
exclude_docs: |
  work/
  zh/work/
  templates/
  zh/templates/
  superpowers/

# Plugins: enable search and static-i18n for bilingual support
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          link: /
        - locale: zh
          name: 中文
          build: true
          link: /zh/
          nav_translations:
            Home: 首页
            Getting Started: 快速开始
            Core Concepts: 核心概念
            Guides: 工程指南
            API Reference: API 参考
            Internals: 内部机制
            Migration: 版本迁移
            Overview: 总览
            Quick Start: 快速开始
            API Reference Overview: API 参考总览
            Architecture: 架构设计
            Runtime Consolidation: 运行时整合
            Final Structure Migration (0.93a6 and earlier → final layout): 最终结构迁移（0.93a6 及更早 → 最终布局）
            Components: 组件
            Decorators: 装饰器
            Injection: 注入
            Application Runtime: 应用运行时
            Lifecycle: 生命周期
            Middleware: 中间件
            Extensions: 扩展
            RESTful API: RESTful API
            Module Reference: 模块参考
            application.lifecycle: 应用生命周期
            application: 应用程序
            core: 核心
            controller: 控制器
            service: 服务
            Examples: 示例
            Runtime Consolidation Overview: 运行时整合概览
            Migration Guide (0.90/0.93 → 0.95): 迁移指南（0.90/0.93 → 0.95）
            Migration Guide v2 (v0.9x → v0.93): 迁移指南 v2（v0.9x → v0.93）
            Import Migration (0.83 → 0.90): 导入迁移（0.83 → 0.90）
            Dependency Injection: 依赖注入
            Framework Semantics: 框架语义
            Web Runtime: Web Runtime
            Static Files & SPA: 静态文件与 SPA
            DI Quick Reference: DI 快速参考
            Parameter System: 参数系统
            Extension Development: 扩展开发
            Quick Start Extensions: 扩展快速入门
            Build & Run: 构建与运行
            Packaging: 打包
            Testing: 测试
            Contributing: 贡献指南

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - tables
  - pymdownx.superfences

theme:
  name: material
  custom_dir: overrides

extra_css:
  - assets/stylesheets/version-switcher.css

extra_javascript:
  - assets/javascripts/version-switcher.js

extra:
  version:
    channel: !ENV [DOCS_CHANNEL, stable]
    current: !ENV [DOCS_CURRENT_VERSION, dev]
    stable_label: !ENV [DOCS_STABLE_VERSION, ""]
    stable_url: !ENV [DOCS_STABLE_URL, "/Cullinan/"]
    pre_label: !ENV [DOCS_PRE_VERSION, ""]
    pre_url: !ENV [DOCS_PRE_URL, "/Cullinan/pre/"]
    pre_is_available: !ENV [DOCS_PRE_AVAILABLE, "false"]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cullinan-py/cullinan
