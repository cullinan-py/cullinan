[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cullinan"
dynamic = ["version"]
description = "Cullinan — A pluggable IoC/DI web framework"
readme = { file = "README.MD", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "cullinan-py", email = "cullinan@plumeink.com" },
]
classifiers = [
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/cullinan-py/cullinan"
Source = "https://github.com/cullinan-py/cullinan"
Wiki = "https://github.com/cullinan-py/cullinan/wiki"

[project.optional-dependencies]
tornado = ["tornado"]
asgi = ["uvicorn"]
openapi = ["pyyaml"]
full = ["tornado", "uvicorn", "pyyaml"]

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*", "docs*", "docs_archive*", "scripts*", "build*", "dist*", "site*"]

[tool.setuptools.package-data]
cullinan = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "cullinan._version.__version__" }
