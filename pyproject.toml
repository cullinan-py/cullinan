[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cullinan"
dynamic = ["version"]
description = "Cullinan — A pluggable IoC/DI web framework"
readme = { file = "README.MD", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "plumeink", email = "cullinan@plumeink.com" },
]
classifiers = [
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
# No runtime dependencies: the configuration layer reads JSON with the
# standard library, and optional formats only when the environment provides them.
dependencies = []

[project.urls]
Homepage = "https://github.com/cullinan-py/cullinan"
Source = "https://github.com/cullinan-py/cullinan"
Wiki = "https://github.com/cullinan-py/cullinan/wiki"

[project.optional-dependencies]
tornado = ["tornado"]
asgi = ["uvicorn"]
openapi = ["pyyaml"]
full = ["tornado", "uvicorn", "pyyaml"]

[tool.setuptools.packages.find]
exclude = [
  "tests*", "examples*", "docs*", "docs_archive*", "scripts*",
  "benchmarks*", "build*", "dist*", "site*",
  # ``overrides/`` is the MkDocs Material theme override directory
  # (``overrides/main.html``), not a Python package. Without this line the finder
  # treats it as one, so the wheel ships a top-level ``overrides`` alongside the
  # PyPI distribution of the same name and ``top_level.txt`` advertises a module
  # the wheel does not contain.
  "overrides*",
]

[tool.setuptools.package-data]
cullinan = ["py.typed", "_contracts.json"]

[tool.setuptools.dynamic]
version = { attr = "cullinan._version.__version__" }

# Coverage is measured over the package only: the tests, examples and scripts
# are the instruments, not the subject. The floor is deliberately set just
# below the measured value rather than at a round number above it -- a gate that
# fails on the day it lands teaches people to bypass it. Raising the floor is
# welcome at any time; lowering it needs an ADR saying what regressed and why
# the code cannot be covered, because a floor that drifts down is not a gate.
[tool.coverage.run]
source = ["cullinan"]
branch = false
omit = ["cullinan/_version.py"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
