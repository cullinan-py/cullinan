# Builds the package from the tagged commit and uploads it to PyPI when a
# GitHub Release is published.
#
# Two things are checked before anything is uploaded, because a PyPI upload
# cannot be undone (a version number can only be yanked, never reused):
#
#   1. the tag names the version the code carries -- otherwise the artefact is
#      labelled with a version the source does not claim;
#   2. the built wheel actually imports and reports that version -- otherwise
#      a packaging fault ships as a release.
#
# The suite runs here as well, before the build. That is not belt-and-braces: the
# release this repository shipped before had a tag whose commit carried no test runs
# at all. The suite had passed on a different commit with the same tree, so the
# evidence existed but was not attached to what was released. Asking GitHub what ran
# cannot fix that -- enumerating commits by tree is not something the checks API does.
# Producing the evidence in the job that consumes it can, and does.
#
# For more information on publishing to package registries see
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  release:
    types: [published]
  # A release that cannot be re-run is a release that can only be correct once.
  # The upload is driven by the published event, and that event fires exactly once;
  # an edit to the release does not fire it again. This input is the way back in
  # when the job itself was the thing that failed -- it names the tag to publish,
  # so the content published is still the tagged content and never the branch.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.96a11"
        required: true

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # The suite runs in this job, and part of it reads history: one test asserts
        # that the declaration baseline is an ancestor of HEAD. A default checkout is
        # one commit deep, so that commit does not exist and the test fails -- the
        # job then refuses to upload a release that is perfectly fine. Fetch the
        # history the suite needs.
        ref: ${{ inputs.tag || github.ref }}
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Install test dependencies
      run: pip install -r requirements-dev.txt
    - name: Run the suite, writing a report the next step can judge
      run: python -m pytest tests -q --junit-xml="$RUNNER_TEMP/junit.xml"
    - name: Refuse to publish unless that report says the suite passed
      # The exit code above is one bit: it cannot distinguish "1200 passed" from "no
      # tests collected under a configuration that silently matched nothing". The
      # report can, so it is read rather than trusted. `--min-tests` is a floor far
      # below the current count: reaching it means a whole area of the suite has
      # stopped being collected, which is worth an explanation before a release.
      run: python scripts/check_junit.py "$RUNNER_TEMP/junit.xml" --min-tests 1000
    - name: Verify the tag names the version the code carries
      env:
        RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      run: python scripts/check_release_tag_matches_version.py --tag "$RELEASE_TAG"
    - name: Build package
      run: python -m build --sdist --wheel --outdir dist/
    - name: Check metadata
      run: twine check dist/*
    - name: Check the wheel declares its types
      run: |
        python - <<'PY'
        import sys, zipfile, pathlib
        wheels = list(pathlib.Path("dist").glob("*.whl"))
        if len(wheels) != 1:
            sys.exit(f"expected exactly one wheel, found {[w.name for w in wheels]}")
        names = zipfile.ZipFile(wheels[0]).namelist()
        required = ["cullinan/py.typed", "cullinan/_contracts.json"]
        missing = [name for name in required if name not in names]
        if missing:
            sys.exit(f"{wheels[0].name} is missing {missing}")
        print(f"{wheels[0].name} carries {', '.join(required)}")
        PY
    - name: Install the built wheel and read its version back
      env:
        RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        python -m venv "$RUNNER_TEMP/smoke"
        "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
        "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
        import os, sys
        import cullinan
        expected = os.environ["RELEASE_TAG"].removeprefix("v")
        if cullinan.__version__ != expected:
            sys.exit(f"installed wheel reports {cullinan.__version__}, tag says {expected}")
        print(f"installed wheel imports and reports {cullinan.__version__}")
        PY
    - name: Publish package
      env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_TOKEN }}
      run: |
          twine upload dist/*
