name: CI

on:
  push:
    branches:
      - master
      # Every release branch shares the release/ prefix, so a single pattern
      # covers all of them. The publisher workflow fires on the GitHub Release
      # event and uploads the tagged commit to PyPI, so that commit has to have
      # run the test matrix, lint and build checks first.
      - "release/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest tests -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  build:
    name: build & twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist & wheel
        run: python -m build --sdist --wheel --outdir dist/
      - name: Twine check
        run: twine check dist/*

  meta-sync:
    # Every commit that touches a release-process / configuration path must
    # carry a well-formed `Meta-Sync:` trailer in its message. This job is the
    # primary enforcement point; it runs on every pull request and on every
    # push the workflow already covers. It is deliberately lightweight and does
    # not repeat the test matrix above.
    name: meta-sync declaration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve commit range
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=range" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "mode=commit" >> "$GITHUB_OUTPUT"
              echo "ref=${after}" >> "$GITHUB_OUTPUT"
            else
              echo "mode=range" >> "$GITHUB_OUTPUT"
              echo "ref=${before}..${after}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check Meta-Sync declaration
        run: |
          if [ "${{ steps.target.outputs.mode }}" = "range" ]; then
            python scripts/check_sync_declaration.py --repo . --range "${{ steps.target.outputs.ref }}"
          else
            python scripts/check_sync_declaration.py --repo . --commit "${{ steps.target.outputs.ref }}"
          fi
