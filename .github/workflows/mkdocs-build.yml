name: Build and Publish Docs

on:
  push:
    branches:
      - master
      - release/**
      - feat/v0.94**
    paths:
      - 'docs/**'
      - 'overrides/**'
      - '.github/workflows/mkdocs-build.yml'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'cullinan/_version.py'
      - 'cullinan/__init__.py'
      - 'cullinan/core/__init__.py'
    tags-ignore:
      - '**'
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - '.github/workflows/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'cullinan/_version.py'
      - 'cullinan/__init__.py'
      - 'cullinan/core/__init__.py'
  workflow_dispatch:
    inputs:
      force_channel:
        description: 'Force deploy channel (skip=auto-detect, stable, pre)'
        required: false
        default: 'skip'

concurrency:
  group: docs-gh-pages-publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    outputs:
      deploy_site: ${{ steps.deploy_gate.outputs.deploy_site }}
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.10'
      NODE_VERSION: '18'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect documentation release channel
        id: channel
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.event.repository.master_branch || 'main' }}
          FORCE_CHANNEL: ${{ github.event.inputs.force_channel || 'skip' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          pyproject_text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          version_text = pathlib.Path("cullinan/_version.py").read_text(encoding="utf-8")
          init_text = pathlib.Path("cullinan/__init__.py").read_text(encoding="utf-8")
          core_text = pathlib.Path("cullinan/core/__init__.py").read_text(encoding="utf-8")

          version_match = re.search(r"__version__\s*=\s*['\"]([^'\"]+)['\"]", version_text)
          init_match = re.search(r"from cullinan\._version import __version__", init_text)
          core_match = re.search(r"from cullinan\._version import __version__", core_text)
          dynamic_match = re.search(r"(?m)^dynamic\s*=\s*\[\s*['\"]version['\"]\s*\]", pyproject_text)
          attr_match = re.search(
              r"(?ms)\[tool\.setuptools\.dynamic\].*?version\s*=\s*\{\s*attr\s*=\s*['\"]([^'\"]+)['\"]\s*\}",
              pyproject_text,
          )

          if not version_match or not init_match or not core_match or not dynamic_match or not attr_match:
              raise SystemExit("Unable to detect package version from cullinan/_version.py or pyproject.toml")

          version = version_match.group(1)
          version_attr = attr_match.group(1)

          if version_attr != "cullinan._version.__version__":
              raise SystemExit(f"Unexpected setuptools version attr: {version_attr}")
          branch = os.environ.get("GITHUB_REF_NAME", "")
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          default_branch = os.environ.get("DEFAULT_BRANCH", "main")
          is_pre = "a" in version
          is_default_branch = branch == default_branch
          is_tag_ref = ref_type == "tag"

          # force_channel (workflow_dispatch) overrides auto-detection.
          # Allowed values: skip (auto), stable, pre.
          force_channel = os.environ.get("FORCE_CHANNEL", "skip").strip().lower()
          if force_channel in ("stable", "pre"):
              channel = force_channel
          else:
              if is_default_branch and not is_pre:
                channel = "stable"
              elif (not is_default_branch) and is_pre:
                channel = "pre"
              else:
                channel = "skip"

          outputs = {
              "version": version,
              "branch": branch,
              "default_branch": default_branch,
              "event_name": event_name,
              "ref_type": ref_type,
              "is_tag_ref": str(is_tag_ref).lower(),
              "is_pre": str(is_pre).lower(),
              "channel": channel,
              "should_deploy": str(
                event_name in {"push", "workflow_dispatch"}
                and channel in {"stable", "pre"}
                and not is_tag_ref
              ).lower(),
          }

          github_output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
            for key, value in outputs.items():
              fh.write(f"{key}={value}\n")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs==1.6.1 mkdocs-material==9.7.0 mkdocs-mermaid2-plugin==1.2.3 mkdocs-static-i18n packaging
          npm install -g markdownlint-cli

      - name: Lint markdown
        run: |
          markdownlint "docs/**/*.md" || true

      - name: Prepare gh-pages workspace
        if: steps.channel.outputs.should_deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .gh-pages
          else
            mkdir -p .gh-pages
            cd .gh-pages
            git init
            git checkout --orphan gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            touch .nojekyll
            git add .nojekyll
            git commit -m "Initialize gh-pages"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Load published doc versions
        id: published
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          data = {}
          versions_file = pathlib.Path(".gh-pages/versions.json")
          if versions_file.exists():
            data = json.loads(versions_file.read_text(encoding="utf-8"))

          stable_version = data.get("stable", {}).get("version", "")
          pre_version = data.get("pre", {}).get("version", "")

          github_output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
            fh.write(f"stable_version={stable_version}\n")
            fh.write(f"pre_version={pre_version}\n")
          PY

      - name: Decide whether current pre-release is the newest
        id: precheck
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          from packaging.version import Version

          channel = os.environ.get("CHANNEL", "skip")
          current_version = os.environ.get("CURRENT_VERSION", "")
          published_pre = os.environ.get("PUBLISHED_PRE", "")

          should_publish_pre = True
          if channel == "pre" and published_pre:
            # Allow docs-only fixes to refresh the same published pre version.
            should_publish_pre = Version(current_version) >= Version(published_pre)

          github_output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
            fh.write(f"should_publish_pre={str(should_publish_pre).lower()}\n")
          PY
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          CURRENT_VERSION: ${{ steps.channel.outputs.version }}
          PUBLISHED_PRE: ${{ steps.published.outputs.pre_version }}

      - name: Build site
        env:
          DOCS_SITE_URL: ${{ steps.channel.outputs.channel == 'pre' && format('https://{0}.github.io/{1}/pre/', github.repository_owner, github.event.repository.name) || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          DOCS_CHANNEL: ${{ steps.channel.outputs.channel == 'pre' && 'pre' || 'stable' }}
          DOCS_CURRENT_VERSION: ${{ steps.channel.outputs.version }}
          DOCS_STABLE_VERSION: ${{ steps.channel.outputs.channel == 'stable' && steps.channel.outputs.version || steps.published.outputs.stable_version }}
          DOCS_STABLE_URL: /${{ github.event.repository.name }}/
          DOCS_PRE_VERSION: ${{ steps.channel.outputs.channel == 'pre' && steps.channel.outputs.version || steps.published.outputs.pre_version }}
          DOCS_PRE_URL: /${{ github.event.repository.name }}/pre/
          DOCS_PRE_AVAILABLE: ${{ (steps.channel.outputs.channel == 'pre' || steps.published.outputs.pre_version != '') && 'true' || 'false' }}
        run: |
          mkdocs build --strict

      - name: Debug build metadata
        run: |
          echo "channel=${{ steps.channel.outputs.channel }}"
          echo "version=${{ steps.channel.outputs.version }}"
          echo "ref type=${{ steps.channel.outputs.ref_type }}"
          echo "is tag ref=${{ steps.channel.outputs.is_tag_ref }}"
          echo "default branch=${{ steps.channel.outputs.default_branch }}"
          echo "published stable=${{ steps.published.outputs.stable_version }}"
          echo "published pre=${{ steps.published.outputs.pre_version }}"
          echo "publish pre?=${{ steps.precheck.outputs.should_publish_pre }}"

      - name: Mark deploy eligibility
        id: deploy_gate
        shell: bash
        run: |
          deploy_site=false
          sync_branch=false
          if [ "${{ steps.channel.outputs.should_deploy }}" = "true" ]; then
            deploy_site=true
            if [ "${{ steps.channel.outputs.channel }}" = "stable" ] || [ "${{ steps.precheck.outputs.should_publish_pre }}" = "true" ]; then
              sync_branch=true
            fi
          fi
          echo "deploy_site=${deploy_site}" >> "$GITHUB_OUTPUT"
          echo "sync_branch=${sync_branch}" >> "$GITHUB_OUTPUT"

      - name: Assemble docs payload
        if: steps.deploy_gate.outputs.deploy_site == 'true'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          SYNC_BRANCH: ${{ steps.deploy_gate.outputs.sync_branch }}
          # B1 fix: env vars carry ONLY the current channel's version.
          # The other channel's version is preserved from gh-pages/versions.json
          # by the merge-update script below (read-merge-write single field).
          STABLE_VERSION: ${{ steps.channel.outputs.channel == 'stable' && steps.channel.outputs.version || '' }}
          PRE_VERSION: ${{ steps.channel.outputs.channel == 'pre' && steps.channel.outputs.version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob

          if [ "$SYNC_BRANCH" != "true" ]; then
            echo "Using existing gh-pages content for Pages redeploy."
            exit 0
          fi

          mkdir -p .deploy-tmp

          if [ "$CHANNEL" = "stable" ]; then
            # B1 fix: preserve .git, then delete only the stable site files at the
            # top level of .gh-pages. Keep pre/, CNAME, versions.json, .nojekyll
            # and any future top-level metadata file (no whitelist maintenance).
            if [ -d .gh-pages/.git ]; then
              mv .gh-pages/.git .deploy-tmp/.git
            fi
            find .gh-pages -mindepth 1 -maxdepth 1 \
              ! -name 'pre' \
              ! -name 'CNAME' \
              ! -name 'versions.json' \
              ! -name '.nojekyll' \
              ! -name '.git' \
              -exec rm -rf {} +
            cp -R site/. .gh-pages/
            if [ -d .deploy-tmp/.git ]; then
              mv .deploy-tmp/.git .gh-pages/.git
            fi
          else
            rm -rf .gh-pages/pre
            mkdir -p .gh-pages/pre
            cp -R site/. .gh-pages/pre/
          fi

          python - <<'PY'
          import json
          import os
          import pathlib
          from datetime import datetime, timezone

          # B1 fix: merge-update versions.json. Read existing gh-pages/versions.json,
          # update ONLY the current channel's field, preserve the other channel's field.
          versions_file = pathlib.Path(".gh-pages/versions.json")
          existing = {}
          if versions_file.exists():
              try:
                  existing = json.loads(versions_file.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError):
                  existing = {}

          channel = os.environ.get("CHANNEL", "")
          stable_version = os.environ.get("STABLE_VERSION", "")
          pre_version = os.environ.get("PRE_VERSION", "")

          stable_entry = existing.get("stable", {})
          pre_entry = existing.get("pre", {})

          if channel == "stable":
              stable_entry = {"version": stable_version, "path": "/"}
              # pre_entry preserved from existing
          elif channel == "pre":
              pre_entry = {"version": pre_version, "path": "/pre/"}
              # stable_entry preserved from existing

          payload = {
              "stable": stable_entry,
              "pre": pre_entry,
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }

          versions_file.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          pathlib.Path(".gh-pages/.nojekyll").write_text("", encoding="utf-8")
          PY

      - name: Sync gh-pages branch
        if: steps.deploy_gate.outputs.sync_branch == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          CURRENT_VERSION: ${{ steps.channel.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd .gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No gh-pages branch changes to push."
            exit 0
          fi
          commit_message="docs: publish ${CHANNEL} ${CURRENT_VERSION}"
          git commit -m "${commit_message}"

          for attempt in 1 2 3; do
            if git push origin gh-pages; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "gh-pages push failed after ${attempt} attempts."
              exit 1
            fi

            echo "gh-pages push was rejected; refreshing from origin/gh-pages and retrying..."
            git fetch origin gh-pages
            git reset --soft origin/gh-pages
            git commit -m "${commit_message}"
          done

      - name: Upload Pages artifact
        if: steps.deploy_gate.outputs.deploy_site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .gh-pages

  deploy:
    if: needs.docs.outputs.deploy_site == 'true'
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
